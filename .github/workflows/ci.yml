name: ci

# build, test, and run the stage 0 verification hygiene. everything runs inside
# the pinned nix dev shell so CI matches local development exactly.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # every step is a scripts/check.sh gate, the same ones the git hooks
      # run, so a green local `scripts/check.sh ci` means a green ci run.
      # split into steps so a failure names its gate.
      - name: style
        run: scripts/check.sh style

      - name: clippy (jos-core, jig, kernel, user, -D warnings)
        run: scripts/check.sh clippy

      - name: test (jos-core and jig, host)
        run: scripts/check.sh test

      - name: miri (jos-core)
        run: scripts/check.sh miri

      - name: kani (jos-core)
        run: scripts/check.sh kani

      - name: kernel boot tests (qemu, through jig)
        run: scripts/check.sh qemu

      - name: root task across the machine matrix (qemu)
        run: scripts/check.sh matrix
